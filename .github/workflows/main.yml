# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite rodar manual pela aba Actions

# necessario para o GITHUB_TOKEN poder dar push na branch gh-pages
permissions:
  contents: write

# evita dois deploys simultaneos pisando um no outro (last push wins)
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20        # 18 a 22 funcionam, desde que com a flag openssl abaixo
          cache: npm

      # npm ci puro falha na arvore antiga (peer deps de react-leaflet-markercluster rc1 etc)
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          # webpack 4 (react-scripts 4.0.3) quebra no OpenSSL 3 do Node 17+ sem esta flag
          NODE_OPTIONS: --openssl-legacy-provider
          # CRA com CI=true (padrao no Actions) trata warning de ESLint como erro e derruba o build
          CI: "false"
          # secrets -> bundle. Configure cada um em Settings > Secrets and variables > Actions
          REACT_APP_BING_MAPS_API_KEY: ${{ secrets.REACT_APP_BING_MAPS_API_KEY }}
          REACT_APP_CRYPTSEED: ${{ secrets.REACT_APP_CRYPTSEED }}
          REACT_APP_GOOGLESHEETID: ${{ secrets.REACT_APP_GOOGLESHEETID }}
          REACT_APP_GOOGLE_PRIVATE_KEY: ${{ secrets.REACT_APP_GOOGLE_PRIVATE_KEY }}
          REACT_APP_GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.REACT_APP_GOOGLE_SERVICE_ACCOUNT_EMAIL }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          cname: mapafome.com.br
